info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/{{RESOURCE}}?file="
  params:
    - name: file
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: RESOURCE
      value: uploads
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody()
        bru.setVar("token",json.token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
