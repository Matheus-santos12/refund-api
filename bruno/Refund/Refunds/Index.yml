info:
  name: Index
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/{{RESOURCE}}?name=Matheus"
  params:
    - name: name
      value: Matheus
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: RESOURCE
      value: refunds

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
