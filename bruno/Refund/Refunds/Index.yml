info:
  name: Index
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/{{RESOURCE}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: RESOURCE
      value: refunds
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        bru.setEnvVar("token",json.token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
