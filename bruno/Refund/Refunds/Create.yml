info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/{{RESOURCE}}"
  body:
    type: json
    data: |-
      {
        "name": "Troca de peças",
        "category": "services",
        "amount": 180.34,
        "filename": "controvante.png"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const json = res.getBody();
        bru.setEnvVar("token",json.token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
